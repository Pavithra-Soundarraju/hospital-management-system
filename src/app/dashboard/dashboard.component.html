
<section class="dashboard-content">

    <!-- DASHBOARD HEADING -->
    <h1>Hospital Management System Dashboard</h1>

    <div class="title-decoration">
        <div class="line-long"></div>
        <div class="line-short"></div>
    </div>

    <!-- DASHBOARD CARDS -->
    <div class="cards-container">

        <!-- DOCTORS CARD -->
        <div class="dashboard-card">

            <div class="card-top">

                <div class="icon-box">
                    <img src="assets/doctor-card.svg" alt="Doctors">
                </div>

                <div>
                    <h4>Doctors (Available)</h4>
                    <h2>{{ doctorCount }}</h2>
                </div>

            </div>

            <div class="card-footer">

                <span class="growth positive">
                    <img src="assets/trending-up.svg" alt="">
                    7.2%
                </span>

                <a href="#" class="view-link">
                    View
                    <img src="assets/external-link.svg" alt="">
                </a>

            </div>

        </div>

        <!-- PATIENT CARD -->
        <div class="dashboard-card">

            <div class="card-top">

                <div class="icon-box">
                    <img src="assets/patient-card.svg" alt="Patients">
                </div>

                <div>
                    <h4>Patients (Checkup &amp; Details)</h4>
                    <h2>{{ patientCount }}</h2>
                </div>

            </div>

            <div class="card-footer">

                <span class="growth negative">
                    <img src="assets/trending-down.svg" alt="">
                    5.2%
                </span>

                <a routerLink="/patients" class="view-link">
                    View
                    <img src="assets/external-link.svg" alt="">
                </a>

            </div>

        </div>

        <!-- APPOINTMENTS CARD -->
        <div class="dashboard-card">

            <div class="card-top">

                <div class="icon-box">
                    <img src="assets/appointment-card.svg" alt="Appointments">
                </div>

                <div>
                    <h4>Appointments (Scheduled)</h4>
                    <h2>{{ appointmentCount }}</h2>
                </div>

            </div>

            <div class="card-footer">

                <span class="growth positive">
                    <img src="assets/trending-up.svg" alt="">
                    9.2%
                </span>

                <a href="#" class="view-link">
                    View
                    <img src="assets/external-link.svg" alt="">
                </a>

            </div>

        </div>

    </div>

</section>
